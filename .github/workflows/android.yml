name: Build KAMAL MOONSHOT HUNTER APK

on:
workflow_dispatch:
push:
branches:
- main
paths:
- "android-app/**"
- ".github/workflows/android.yml"

permissions:
contents: read

jobs:
build:
name: Build and upload Android APK
runs-on: ubuntu-latest

steps:
  - name: Checkout source
    uses: actions/checkout@v4

  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Install Android SDK packages
    run: sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: "8.9"

  - name: Build debug APK
    working-directory: android-app
    run: gradle --no-daemon assembleDebug

  - name: Verify APK exists
    shell: bash
    run: |
      APK="android-app/app/build/outputs/apk/debug/app-debug.apk"
      if [ ! -f "$APK" ]; then
        echo "::error::APK was not generated at $APK"
        echo "APK files found:"
        find android-app -type f -name "*.apk" -print
        exit 1
      fi
      ls -lh "$APK"

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: KAMAL-MOONSHOT-HUNTER-debug-apk
      path: android-app/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
      retention-days: 14